<ion-header>
  <ion-toolbar>
      <ion-buttons slot="start">
          <app-back-button></app-back-button>
          <ion-menu-button></ion-menu-button>
      </ion-buttons>
      <ion-title>Nutrition</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="recipe-home">
    <br/>
    <div class="ion-padding-horizontal">
      <div class="title">
        Les recettes pour sportifs
      </div>
      <div class="subtitle">
        Ces recettes ont été sélectionnées pour vous aider les sportifs à s'alimenter sainement.
      </div>
    </div>

    <div class="segment-container">
      <ion-segment [(ngModel)]="selectedSegment" (ionChange)="segmentChanged($event)">
        <ion-segment-button value="recipes">
          <ion-label>Recettes</ion-label>
        </ion-segment-button>
        <ion-segment-button value="programs">
          <ion-label>Programmes</ion-label>
        </ion-segment-button>
      </ion-segment>
    </div>

    <div class="content-container">
      <div class="recipes-content" *ngIf="selectedSegment() === 'recipes'">
        <app-recipes-tab [categories]="categories"></app-recipes-tab>
      </div>

      <div class="programs-content" *ngIf="selectedSegment() === 'programs'">
        <app-programs-tab></app-programs-tab>
      </div>
    </div>
  </div>

  <br/>
  <br/>

  <app-button-to-chat></app-button-to-chat>
</ion-content>

<div class="spinner" *ngIf="isLoading()">
  <ion-spinner></ion-spinner>
</div>

<div class="card-list" *ngIf="!isLoading()">
  <div class="tool-card enhanced-tool-card" *ngFor="let program of programs()">
    <div class="image-container">
      <img [title]="program.name" [src]="program.imageUrl" />
    </div>
    <div class="card-description">
      <div class="spacer"></div>
      <h3>{{ program.name }}</h3>
      <ion-button expand="block" shape="round" [routerLink]="['/food-program-detail', program.slug]">
        <span>Découvrir</span>
        <ion-icon slot="end" name="arrow-forward"></ion-icon>
      </ion-button>
    </div>
  </div>
</div>

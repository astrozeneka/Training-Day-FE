<div class="spinner" *ngIf="isLoading()">
  <ion-spinner></ion-spinner>
</div>

<div class="card-list" *ngIf="!isLoading()">
  <div class="calorie-box" *ngFor="let program of programs()" [routerLink]="['/food-program-detail', program.slug]">
    <div class="calorie-range">
      {{ program.name }}
    </div>
  </div>
</div>

<ion-header>
    <ion-toolbar>
        <ion-buttons slot="start">
            <app-back-button></app-back-button>
            <ion-menu-button></ion-menu-button>
        </ion-buttons>
        <ion-title>Abonnements</ion-title>
        <ion-progress-bar [value]="processProgress" *ngIf="processProgress > 0"></ion-progress-bar>
    </ion-toolbar>
</ion-header>

<ion-content>
    <div class="ios-purchase-invoice">
        <h1 class="display-1 ion-padding">Confirmez votre achat</h1>

        <form [formGroup]="form">
            <div class="ion-padding-horizontal description">
                Sélectionne ton abonnement.
            </div>
            <div>
                <div *ngFor="let displayable of uiAdapter?.displayables">
                    {{ displayable.durationText }} <br/>
                    {{ displayable.displayPrice }} 
                        <span *ngIf="displayable.isMonthlyPrice">
                            /mois
                        </span> <br/>
                    <span style="text-decoration:line-through">{{ displayable.normalPrice }}</span>
                    <span *ngIf="!displayable.isMonthlyPrice && displayable.monthlyPrice && !displayable.isFree"> . {{ displayable.monthlyPrice }}/mois</span>
                    <span *ngIf="!displayable.isFree"> . {{ displayable.weeklyPrice }}€/sem.</span> 
                    <br/>
                     <br/> <br/> <br/>
                </div>
            </div>

            <div class="ion-padding-horizontal bubble-wrapper">
                <app-promotional-bubble-selector-ios *ngIf="productList && productId" [product]="productList[productId]"
                    formControlName="offer"></app-promotional-bubble-selector-ios>
                <div class="placeholder" *ngIf="offersAreLoading"><ion-spinner></ion-spinner></div>
            </div>

            <div class="floating-bottom">
                <div class="ion-padding">
                    <div class="cgv-row">
                        <ion-label>Accepter <a class="a" (click)="openCGV()">les CGV</a></ion-label>
                        <ion-checkbox formControlName="acceptCGV" slot="end" color="primary"></ion-checkbox>
                    </div>

                    <app-ux-button expand="block" color="primary" shape="round" [disabled]="!form.valid"
                        (click)="continueToPayment()" [loading]="isLoading">
                        Continuer
                    </app-ux-button>
                    <!-- TODO, redeem code -->
                    <div class="helper ion-text-center" style="font-size:smaller">
                        <!-- Enregistrement de votre commande en cours <br/> -->
                        {{ loadingStep }}
                    </div>
                </div>
            </div>
        </form>
    </div>
</ion-content>

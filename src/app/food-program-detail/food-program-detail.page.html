<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <app-back-button></app-back-button>
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Nutrition</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div [class]="'loading-placeholder ' + (isLoading() ? '' : 'hidden')">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <br/><br/>
  <div class="food-program-detail">

    <div class="title">
      {{ categoryName() }}
    </div>

    <!-- Empty State -->
    <div *ngIf="!isLoading() && foodPrograms().length === 0" class="empty-state">
      <ion-icon name="nutrition-outline" class="empty-icon"></ion-icon>
      <p>Aucun programme alimentaire disponible pour le moment</p>
    </div>

    <!-- Actual Programs Content -->
    <div class="programs-wrapper">
      <a [routerLink]="['/recipe-detail', program.id]" *ngFor="let program of foodPrograms()">
        <div class="program">
          <div class="program-image">
            <img [src]="program.imageUrl" alt="Image du programme">
          </div>
          <div class="headings">
            <div class="title">{{ program.title }}</div>
            <div class="subtitle">{{ program.category }}</div>
          </div>
        </div>
      </a>
    </div>
  </div>

  <app-bottom-navbar-placeholder></app-bottom-navbar-placeholder>
</ion-content>
